spring.application.name=eventpulse
spring.datasource.url=jdbc:h2:file:./data/attendees;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
app.base-url=${APP_BASE_URL:http://localhost:8080}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=eventpulse-check-in-consumer
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.check-in-topic=${KAFKA_CHECK_IN_TOPIC:eventpulse.checkins}
app.kafka.outbox.poll-interval=${KAFKA_OUTBOX_POLL_INTERVAL:1000}
