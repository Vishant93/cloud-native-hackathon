name: Build and deploy EventPulse

on:
  push:
    branches:
      - deploy/eventpulse
    paths-ignore:
      - README.md
      - deploy/kustomization.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-eventpulse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Point the EventPulse manifests at the new image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin deploy/eventpulse
            git reset -q --hard FETCH_HEAD
            sed -i "s|newTag:.*|newTag: ${TAG}|" deploy/kustomization.yaml
            if git diff --quiet; then exit 0; fi
            git add deploy/kustomization.yaml
            git commit -qm "deploy: ${TAG} [skip ci]"
            if git push -q origin HEAD:deploy/eventpulse; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not update the EventPulse image tag after 5 attempts." >&2
          exit 1
