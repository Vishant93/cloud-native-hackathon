apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eventpulse
spec:
  parentRefs:
    - name: cnh
      namespace: gateway
      sectionName: https
  hostnames:
    - vishant.cnh.radarhq.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /eventpulse
      backendRefs:
        - name: eventpulse-app
          port: 80
