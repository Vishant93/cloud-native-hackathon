apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventpulse-app
  labels:
    app.kubernetes.io/name: eventpulse
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventpulse
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventpulse
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: eventpulse-app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_BASE_URL
              value: https://vishant.cnh.radarhq.io/eventpulse
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /eventpulse
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: eventpulse-kafka:9092
            - name: SPRING_DATASOURCE_URL
              value: jdbc:h2:file:/app/data/attendees;DB_CLOSE_ON_EXIT=FALSE
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          volumeMounts:
            - name: attendee-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /eventpulse/actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /eventpulse/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /eventpulse/actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: attendee-data
          emptyDir: {}
